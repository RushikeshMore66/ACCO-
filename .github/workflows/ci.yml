name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent-09c-reply-intelligence]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acco
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: acco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acco -d acco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ACCO_ENVIRONMENT: test
      ACCO_DATABASE_URL: sqlite:///./ci.db
      ACCO_JWT_SECRET_KEY: ci-only-synthetic-jwt-secret-key-for-testing-only-32chars
      ACCO_EMAIL_WEBHOOK_SIGNING_SECRET: ci-only-synthetic-webhook-signing-secret
      ACCO_CELERY_BROKER_URL: redis://localhost:6379/0
      ACCO_OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check app tests migrations
      - name: Ruff format check
        run: ruff format --check app tests migrations
      - name: Run tests without OpenAI network access
        run: pytest -q
      - name: PostgreSQL integration tests (Alembic from empty schema)
        env:
          ACCO_TEST_DATABASE_URL: postgresql+psycopg://acco:ci-only-synthetic-password@localhost:5432/acco_test
        run: pytest tests/pg -v
