name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent-09c-reply-intelligence]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ACCO_DATABASE_URL: sqlite:///./ci.db
      ACCO_SECRET_KEY: ci-only-secret-key-that-is-not-used-outside-tests
      ACCO_OPENAI_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check app tests migrations
      - name: Ruff format check
        run: ruff format --check app tests migrations
      - name: Run tests without OpenAI network access
        run: pytest -q
