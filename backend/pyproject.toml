[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acco-backend"
version = "0.1.0"
description = "AI-assisted accounts receivable & collections modular monolith backend"
authors = [{ name = "ACCO Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.66.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["postgres: requires an isolated PostgreSQL database (ACCO_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"
